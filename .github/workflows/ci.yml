name: CI

on:
  workflow_dispatch:
    inputs:
      upload_reports:
        description: Upload test, coverage, and dependency audit reports
        type: boolean
        required: false
        default: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      COVERAGE_LINE_THRESHOLD: 70
      COVERAGE_BRANCH_THRESHOLD: 52
      GUI_COVERAGE_LINE_THRESHOLD: 22
      GUI_COVERAGE_BRANCH_THRESHOLD: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: >-
          dotnet restore
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=low
          -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

      - name: Audit dependencies
        run: |
          mkdir -p TestResults
          dotnet list PkgLens.slnx package --vulnerable --include-transitive | tee TestResults/dependency-audit.txt

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test with Core and CLI coverage
        run: >-
          dotnet test --no-build -c Release
          --verbosity normal
          --logger trx
          --results-directory TestResults/Core
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude=[PkgLens.Gui]*

      - name: Test headless GUI with coverage
        run: >-
          dotnet test tests/PkgLens.Core.Tests/PkgLens.Core.Tests.csproj
          --no-build -c Release
          --verbosity normal
          --filter FullyQualifiedName~PkgLens.Core.Tests.Gui
          --logger trx
          --results-directory TestResults/Gui
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[PkgLens.Gui]*

      - name: Enforce Core and CLI coverage thresholds
        shell: pwsh
        run: >-
          ./eng/Check-Coverage.ps1
          -Name "Core / CLI"
          -ResultsDirectory TestResults/Core
          -MinimumLinePercent $env:COVERAGE_LINE_THRESHOLD
          -MinimumBranchPercent $env:COVERAGE_BRANCH_THRESHOLD
          -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Enforce GUI coverage thresholds
        shell: pwsh
        run: >-
          ./eng/Check-Coverage.ps1
          -Name GUI
          -ResultsDirectory TestResults/Gui
          -MinimumLinePercent $env:GUI_COVERAGE_LINE_THRESHOLD
          -MinimumBranchPercent $env:GUI_COVERAGE_BRANCH_THRESHOLD
          -SummaryPath $env:GITHUB_STEP_SUMMARY

      - name: Publish quality reports
        if: ${{ always() && inputs.upload_reports }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: TestResults
          if-no-files-found: warn
          retention-days: 3
