name: Release

# Push a v* tag matching <Version> in Directory.Build.props to publish a release.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read central version
        id: version
        shell: pwsh
        run: |
          [xml] $props = Get-Content -LiteralPath Directory.Build.props
          $version = [string] $props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Directory.Build.props contains an invalid release version: '$version'."
          }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match Directory.Build.props version '$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.rid }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15,       rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish CLI (pkglens)
        run: >
          dotnet publish src/PkgLens.Cli/PkgLens.Cli.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:InformationalVersion=${{ needs.prepare.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -p:DebugType=none -p:DebugSymbols=false
          -o publish/cli

      - name: Publish GUI
        run: >
          dotnet publish src/PkgLens.Gui/PkgLens.Gui.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:InformationalVersion=${{ needs.prepare.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -p:DebugType=none -p:DebugSymbols=false
          -o publish/gui

      - name: Verify embedded version
        shell: pwsh
        run: |
          $name = if ($IsWindows) { 'pkglens.exe' } else { 'pkglens' }
          $executable = Join-Path 'publish/cli' $name
          $actual = (& $executable --version).Trim()
          $expected = 'pkglens ${{ needs.prepare.outputs.version }}'
          if ($actual -ne $expected) { throw "Expected '$expected', got '$actual'." }

      - name: Add version to executable names
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.version }}'
          $extension = if ($IsWindows) { '.exe' } else { '' }
          $renames = @(
            @{ Source = "publish/cli/pkglens$extension"; Destination = "publish/cli/pkglens-$version$extension" },
            @{ Source = "publish/gui/PkgLens.Gui$extension"; Destination = "publish/gui/PkgLens-$version$extension" }
          )
          foreach ($rename in $renames) {
            if (-not (Test-Path -LiteralPath $rename.Source -PathType Leaf)) {
              throw "Published executable was not found: $($rename.Source)"
            }
            Move-Item -LiteralPath $rename.Source -Destination $rename.Destination
          }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/cli/* -DestinationPath "artifacts/pkglens-cli-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/gui/* -DestinationPath "artifacts/pkglens-gui-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p artifacts
          tar -C publish/cli -czf "artifacts/pkglens-cli-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.tar.gz" .
          tar -C publish/gui -czf "artifacts/pkglens-gui-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.tar.gz" .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkglens-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: PkgLens ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: artifacts/**/*
